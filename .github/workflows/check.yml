name: "결과 확인"

# 연금 추첨(목 19:05) · 로또 추첨(토 20:35) 뒤. 일요일은 보충.
on:
  schedule:
    - cron: "30 11 * * 4"   # 목 20:30 KST
    - cron: "30 12 * * 6"   # 토 21:30 KST
    - cron: "0 1 * * 0"     # 일 10:00 KST (보충)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행 (알림·기록 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lotto
  cancel-in-progress: false

jobs:
  check:
    if: github.repository != 'mopil/lotto-safe-auto-buy'   # 템플릿 원본에선 돌지 않는다 — 내 레포에서만
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 레포가 Private 인지 확인 — Public 이면 멈춤
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "## ❌ 레포가 Public 이에요" >> "$GITHUB_STEP_SUMMARY"
            echo "실행 기록에 예치금·구매 내역이 남아서 Public 레포에선 돌지 않아요. Settings → General → Danger Zone 에서 Private 으로 바꾼 뒤 다시 실행해 주세요." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::레포가 Public 이라 멈췄어요 (Private 으로 바꿔 주세요)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 상태 브랜치(state) 꺼내기 — 없으면 멈춤
        run: |
          git config user.name "lotto-safe-auto-buy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin state >/dev/null; then
            echo "::error::아직 설정 전이에요. Actions 탭에서 '① 설정' 을 먼저 실행해 주세요."
            exit 1
          fi
          git fetch origin state:state
          git worktree add .state state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 결과 확인
        env:
          LOTTO_BACKEND: actions
          LOTTO_STATE_DIR: ${{ github.workspace }}/.state
          LOTTO_SECRETS: ${{ secrets.LOTTO_SECRETS }}
          LOTTO_JITTER: ${{ github.event_name == 'schedule' && '1' || '0' }}
          DRY_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python lotto_safe/lotto.py check $DRY_FLAG
